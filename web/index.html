<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Encurtador de Links</title>
  </head>
  <body>
    <main>
      <h1>🔗 Encurtador de Links</h1>

      <form id="form">
        <input
          type="url"
          id="url"
          placeholder="https://exemplo.com/uma/url/muito/longa"
          required
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" id="botao" class="encurtar">Encurtar</button>
      </form>

      <div id="resultado"></div>
      <div id="erro" class="erro" role="alert"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
